name: Starmap publish layer (oci, single arch)
description: Build one arch of a unikernel and push it to GHCR (per-arch tag)

inputs:
  image:
    description: OCI image without tag, e.g. ghcr.io/owner/name
    required: true
  ghcrToken:
    description: token for GHCR login
    required: true
  semver:
    description: version to publish (e.g. v1.0.0)
    required: true
  arch:
    description: single architecture to build (e.g. x86_64)
    required: true
  plat:
    description: platform for the target
    required: false
    default: qemu

runs:
  using: composite
  steps:
    - name: Set Kraftfile target
      shell: bash
      run: |
        printf '\ntargets:\n  - %s/%s\n' "${{ inputs.plat }}" "${{ inputs.arch }}" >> Kraftfile
        echo "--- Kraftfile ---"; cat Kraftfile

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.ghcrToken }}

    - name: Build and push (per-arch tag)
      uses: unikraft/kraftkit@stable
      with:
        workdir: .
        arch: ${{ inputs.arch }}
        plat: ${{ inputs.plat }}
        output: oci://${{ inputs.image }}:${{ inputs.semver }}-${{ inputs.arch }}
        push: true
