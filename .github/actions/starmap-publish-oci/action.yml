name: Starmap publish layer (oci, single arch)
description: Build one arch of a unikernel, push it to GHCR, and register that build in starmap

inputs:
  starmapUrl:
    description: Base URL of the starmap gateway
    required: true
  image:
    description: OCI image without tag, e.g. ghcr.io/owner/name
    required: true
  ghcrToken:
    description: token for GHCR login
    required: true
  semver:
    description: version to publish (e.g. v1.0.0)
    required: true
  arch:
    description: single architecture to build (e.g. x86_64)
    required: true
  plat:
    description: platform for the target
    required: false
    default: qemu
  nodeType:
    description: "StoredProcedure | Trigger | Event | Entrypoint"
    required: false
    default: StoredProcedure

runs:
  using: composite
  steps:
    - name: Set Kraftfile target
      shell: bash
      run: |
        printf '\ntargets:\n  - %s/%s\n' "${{ inputs.plat }}" "${{ inputs.arch }}" >> Kraftfile
        echo "--- Kraftfile ---"; cat Kraftfile

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.ghcrToken }}

    - name: Build and push (per-arch tag)
      uses: unikraft/kraftkit@stable
      with:
        workdir: .
        output: oci://${{ inputs.image }}:${{ inputs.semver }}-${{ inputs.arch }}
        push: true

    - name: Resolve digest
      id: digest
      shell: bash
      run: |
        REF="${{ inputs.image }}:${{ inputs.semver }}-${{ inputs.arch }}"
        DIGEST=$(docker buildx imagetools inspect "$REF" --format '{{.Manifest.Digest}}' 2>/dev/null || echo "$GITHUB_SHA")
        echo "sha=$DIGEST" >> "$GITHUB_OUTPUT"
        echo "digest: $DIGEST"

    - name: Notify starmap (this arch)
      shell: bash
      run: |
        BODY=$(jq -nc \
          --arg st "oci" --arg nt "${{ inputs.nodeType }}" \
          --arg img "${{ inputs.image }}" --arg sv "${{ inputs.semver }}" \
          --arg arch "${{ inputs.arch }}" --arg sha "${{ steps.digest.outputs.sha }}" \
          '{sourceType:$st, nodeType:$nt, image:$img, semver:$sv, builds:[{arch:$arch, sha:$sha}]}')
        echo "POST ${{ inputs.starmapUrl }}/apis/core/v1/layer"
        echo "$BODY"
        curl -sf -X POST "${{ inputs.starmapUrl }}/apis/core/v1/layer" \
          -H "Content-Type: application/json" \
          -d "$BODY"
