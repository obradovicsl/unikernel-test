name: starmap build multiarch (reusable)

on:
  workflow_call:
    inputs:
      image:
        required: true
        type: string
      semver:
        required: true
        type: string
      archs:
        description: comma-separated architectures (e.g. "x86_64,arm64")
        required: false
        default: x86_64
        type: string
      nodeType:
        required: false
        default: StoredProcedure
        type: string
      starmapUrl:
        required: true
        type: string

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # only build archs that this semver does not already have (rebuild would
      # change the digest and starmap rejects a changed (semver,arch) build)
      - name: missing archs -> json matrix
        id: m
        shell: bash
        run: |
          REF=${{ inputs.image }}:${{ inputs.semver }}
          EXISTING=$(docker buildx imagetools inspect "$REF" --raw 2>/dev/null \
            | jq -r '.manifests[]? | select(.platform.os != "unknown") | .platform.architecture' \
            | sort -u || true)
          echo "already on ghcr: ${EXISTING:-<none>}"
          MISSING=""
          for a in $(echo "${{ inputs.archs }}" | tr ',' ' '); do
            a=$(echo "$a" | xargs)
            # yaml arch -> oci platform arch (x86_64->amd64)
            case "$a" in x86_64) oci=amd64 ;; *) oci=$a ;; esac
            if echo "$EXISTING" | grep -qx "$oci"; then
              echo "skip $a (already present)"
            else
              MISSING="$MISSING $a"
            fi
          done
          JSON=$(echo "$MISSING" | tr ' ' '\n' | grep . | jq -R . | jq -sc .)
          echo "matrix=$JSON" >> "$GITHUB_OUTPUT"
          echo "to build: $JSON"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        arch: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.arch }}
        uses: ./.github/actions/starmap-build-oci
        with:
          image: ${{ inputs.image }}
          ghcrToken: ${{ secrets.GITHUB_TOKEN }}
          semver: ${{ inputs.semver }}
          arch: ${{ matrix.arch }}

  merge:
    needs: [prepare, build]
    if: ${{ !cancelled() && needs.build.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # rebuild the list from all requested per-arch tags (old ones survive from
      # earlier runs, new ones from this run) so adding an arch keeps the rest
      - name: Merge per-arch tags into one manifest list
        shell: bash
        run: |
          SRCS=""
          for a in $(echo "${{ inputs.archs }}" | tr ',' ' '); do
            a=$(echo "$a" | xargs)
            TAG=${{ inputs.image }}:${{ inputs.semver }}-$a
            if docker buildx imagetools inspect "$TAG" >/dev/null 2>&1; then
              SRCS="$SRCS $TAG"
            else
              echo "warning: $TAG missing, skipping from list"
            fi
          done
          docker buildx imagetools create -t ${{ inputs.image }}:${{ inputs.semver }} $SRCS
          echo "--- manifest list ---"
          docker buildx imagetools inspect ${{ inputs.image }}:${{ inputs.semver }}

      - name: Notify starmap (list digest + per-arch builds)
        shell: bash
        run: |
          REF=${{ inputs.image }}:${{ inputs.semver }}
          # manifest-list digest (arch-agnostic default)
          LIST_SHA=$(docker buildx imagetools inspect "$REF" --format '{{.Manifest.Digest}}')
          # per-arch digests FROM the merged list (match GHCR)
          RAW=$(docker buildx imagetools inspect "$REF" --raw)
          BUILDS=$(echo "$RAW" | jq -c '[.manifests[]
            | select(.platform.os != "unknown")
            | {arch: .platform.architecture, sha: .digest}]')
          echo "list sha: $LIST_SHA"
          echo "builds: $BUILDS"
          BODY=$(jq -nc \
            --arg st "oci" --arg nt "${{ inputs.nodeType }}" \
            --arg img "${{ inputs.image }}" --arg sv "${{ inputs.semver }}" \
            --arg sha "$LIST_SHA" --argjson builds "$BUILDS" \
            '{sourceType:$st, nodeType:$nt, image:$img, semver:$sv, sha:$sha, builds:$builds}')
          echo "$BODY"
          curl -sf -X POST "${{ inputs.starmapUrl }}/apis/core/v1/layer" \
            -H "Content-Type: application/json" \
            -d "$BODY"
