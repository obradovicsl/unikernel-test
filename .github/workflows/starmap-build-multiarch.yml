name: starmap build multiarch (reusable)

on:
  workflow_call:
    inputs:
      image:
        required: true
        type: string
      semver:
        required: true
        type: string
      archs:
        description: comma-separated architectures (e.g. "x86_64,arm64")
        required: false
        default: x86_64
        type: string
      nodeType:
        required: false
        default: StoredProcedure
        type: string
      starmapUrl:
        required: true
        type: string

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - name: archs -> json matrix
        id: m
        shell: bash
        run: |
          JSON=$(echo "${{ inputs.archs }}" | tr ',' '\n' | sed 's/ //g' | grep . | jq -R . | jq -sc .)
          echo "matrix=$JSON" >> "$GITHUB_OUTPUT"
          echo "matrix: $JSON"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        arch: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.arch }}
        uses: ./.github/actions/starmap-build-oci
        with:
          image: ${{ inputs.image }}
          ghcrToken: ${{ secrets.GITHUB_TOKEN }}
          semver: ${{ inputs.semver }}
          arch: ${{ matrix.arch }}

  merge:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge per-arch tags into one manifest list
        shell: bash
        run: |
          SRCS=""
          for a in $(echo "${{ inputs.archs }}" | tr ',' ' '); do
            a=$(echo "$a" | xargs)
            SRCS="$SRCS ${{ inputs.image }}:${{ inputs.semver }}-$a"
          done
          docker buildx imagetools create -t ${{ inputs.image }}:${{ inputs.semver }} $SRCS
          echo "--- manifest list ---"
          docker buildx imagetools inspect ${{ inputs.image }}:${{ inputs.semver }}

      - name: Notify starmap (list digest + per-arch builds)
        shell: bash
        run: |
          REF=${{ inputs.image }}:${{ inputs.semver }}
          # manifest-list digest (arch-agnostic default)
          LIST_SHA=$(docker buildx imagetools inspect "$REF" --format '{{.Manifest.Digest}}')
          # per-arch digests FROM the merged list (match GHCR)
          RAW=$(docker buildx imagetools inspect "$REF" --raw)
          BUILDS=$(echo "$RAW" | jq -c '[.manifests[]
            | select(.platform.os != "unknown")
            | {arch: .platform.architecture, sha: .digest}]')
          echo "list sha: $LIST_SHA"
          echo "builds: $BUILDS"
          BODY=$(jq -nc \
            --arg st "oci" --arg nt "${{ inputs.nodeType }}" \
            --arg img "${{ inputs.image }}" --arg sv "${{ inputs.semver }}" \
            --arg sha "$LIST_SHA" --argjson builds "$BUILDS" \
            '{sourceType:$st, nodeType:$nt, image:$img, semver:$sv, sha:$sha, builds:$builds}')
          echo "$BODY"
          curl -sf -X POST "${{ inputs.starmapUrl }}/apis/core/v1/layer" \
            -H "Content-Type: application/json" \
            -d "$BODY"
