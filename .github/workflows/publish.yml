name: Publish layer to starmap

on:
  push:
    branches: [main]

jobs:
  publish:
    uses: ./.github/workflows/publish-oci.yml
    with:
      image: ghcr.io/obradovicsl/unikernel-test
      semver: v1.0.3
      archs: "x86_64,arm64"
      nodeType: StoredProcedure
      starmapUrl: https://diligent-smuggler-lanky.ngrok-free.dev
    secrets: inherit
